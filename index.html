    <script>
    window.addEventListener('error', function(e) {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;top:60px;left:10px;right:10px;background:#FEE;color:#900;padding:12px;border-radius:8px;font-size:12px;z-index:999999;font-family:monospace;white-space:pre-wrap;box-shadow:0 4px 12px rgba(0,0,0,.2);';
      d.textContent = '❌ ERREUR:\n' + (e.message || e.error || 'Erreur inconnue') + '\n\nFichier: ' + (e.filename || '?') + '\nLigne: ' + (e.lineno || '?');
      document.body.appendChild(d);
    });
    window.addEventListener('unhandledrejection', function(e) {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;top:60px;left:10px;right:10px;background:#FEF3C7;color:#92400E;padding:12px;border-radius:8px;font-size:12px;z-index:999999;font-family:monospace;white-space:pre-wrap;box-shadow:0 4px 12px rgba(0,0,0,.2);';
      d.textContent = '❌ PROMESSE REJETÉE:\n' + (e.reason?.message || e.reason || 'Erreur inconnue');
      document.body.appendChild(d);
    });
    </script>
